spring.application.name=waste-segregation-backend
spring.config.import=optional:file:.env.properties

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wastedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

ai.api.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
ai.api.key=${AI_API_KEY}
ai.api.model=gemini-3.6-flash